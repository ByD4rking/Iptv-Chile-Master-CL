<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPTV Chile — Player Beta</title>
<meta name="description" content="Reproductor web para las playlists IPTV Chile de la beta.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff}header{padding:18px 20px;border-bottom:1px solid #25304a;background:#11182b}h1{margin:0 0 5px;font-size:1.25rem}.sub{color:#aeb8d0;font-size:.9rem}main{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 76px)}aside{border-right:1px solid #25304a;padding:14px;overflow:auto}section{padding:18px;min-width:0}select,input,button{width:100%;padding:10px;border-radius:9px;border:1px solid #33415f;background:#151e34;color:#eef2ff}button{cursor:pointer;margin-top:8px}.toolbar{display:grid;gap:8px;margin-bottom:12px}#channels{display:grid;gap:6px}.channel{text-align:left;display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center}.channel img{width:36px;height:36px;object-fit:contain;background:#0b1020;border-radius:7px}.channel small{display:block;color:#9eabc6;margin-top:2px}.channel.active{outline:2px solid #5b8cff}video{width:100%;max-height:70vh;background:#000;border-radius:12px;display:block}.status{margin:10px 0;color:#aeb8d0;min-height:22px}.meta{margin-top:10px;color:#9eabc6;font-size:.9rem}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.links a{color:#9dc0ff}@media(max-width:850px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #25304a;max-height:42vh}}
</style></head>
<body><header><h1>📺 IPTV Chile — Player Beta</h1><div class="sub">Reproduce las playlists beta sin modificar las listas originales.</div></header>
<main><aside><div class="toolbar"><label for="playlist">Playlist</label><select id="playlist"></select><input id="filter" type="search" placeholder="Buscar canal…"><button id="reload" type="button">↻ Recargar playlist</button></div><div id="channels"></div></aside>
<section><video id="video" controls playsinline preload="metadata"></video><div id="status" class="status">Selecciona una playlist.</div><div id="meta" class="meta"></div><div class="links"><a id="rawLink" target="_blank" rel="noopener noreferrer">Abrir M3U raw</a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" crossorigin="anonymous"></script>
<script>
(()=>{"use strict";
const branch="beta/v1.1.0-beta.1",base="https://raw.githubusercontent.com/ByD4rking/Iptv-Chile-Master-CL/"+branch+"/";
const playlists=[
["principal","🇨🇱 Principal corregida","IPTV-CHILE-MAESTRA_CORREGIDO.m3u"],["god","🛡️ GOD","IPTV-CHILE-MAESTRA_GOD.m3u"],["generador","⚙️ Generador beta","IPTV-CHILE-GENERADOR/IPTV-CHILE-GENERADOR.m3u"],
["pluto_latam","🌎 Pluto LATAM","pluto/output/playlists/pluto_latam.m3u"],["pluto_cl","🇨🇱 Pluto Chile","pluto/output/playlists/pluto_cl.m3u"],["pluto_es","🇪🇸 Pluto España","pluto/output/playlists/pluto_es.m3u"],["pluto_mx","🇲🇽 Pluto México","pluto/output/playlists/pluto_mx.m3u"],["pluto_ar","🇦🇷 Pluto Argentina","pluto/output/playlists/pluto_ar.m3u"],["pluto_br","🇧🇷 Pluto Brasil","pluto/output/playlists/pluto_br.m3u"],["pluto_us","🇺🇸 Pluto USA","pluto/output/playlists/pluto_us.m3u"]];
const playlistEl=document.getElementById("playlist"),filterEl=document.getElementById("filter"),channelsEl=document.getElementById("channels"),video=document.getElementById("video"),status=document.getElementById("status"),meta=document.getElementById("meta"),rawLink=document.getElementById("rawLink");let hls=null,entries=[];
for(const [id,name] of playlists){const o=document.createElement("option");o.value=id;o.textContent=name;playlistEl.appendChild(o)}
function parseAttrs(line){const attrs={},m=line.match(/^#EXTINF:[^,]*,(.*)$/);attrs.name=m?m[1].trim():"Canal";const head=line.split(",",1)[0],re=/([\w-]+)="([^"]*)"/g;let x;while((x=re.exec(head)))attrs[x[1]]=x[2];return attrs}
function parseM3U(text){const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/),out=[];for(let i=0;i<lines.length;i++){if(!lines[i].startsWith("#EXTINF:"))continue;const a=parseAttrs(lines[i]);let url="";for(let j=i+1;j<lines.length;j++){const l=lines[j].trim();if(!l)continue;if(l.startsWith("#"))continue;url=l;break}if(/^https?:\/\//i.test(url))out.push({name:a.name||"Canal",logo:a["tvg-logo"]||"",group:a["group-title"]||"Sin categoría",url})}return out}
function setStatus(x){status.textContent=x}function destroy(){if(hls){hls.destroy();hls=null}video.removeAttribute("src");video.load()}
function play(entry){destroy();meta.textContent=entry.group+" · "+entry.url;setStatus("Conectando: "+entry.name);document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));const active=[...document.querySelectorAll(".channel")].find(x=>x.dataset.url===entry.url);if(active)active.classList.add("active");
if(window.Hls&&Hls.isSupported()&&/\.m3u8(?:$|\?)/i.test(entry.url)){hls=new Hls({enableWorker:true,lowLatencyMode:true});hls.loadSource(entry.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{setStatus("▶ Reproduciendo: "+entry.name);video.play().catch(()=>{})});hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)setStatus("❌ Error HLS: "+(d.details||"stream no disponible"))});return}
video.src=entry.url;video.addEventListener("loadedmetadata",()=>setStatus("▶ Reproduciendo: "+entry.name),{once:true});video.play().catch(()=>setStatus("Pulsa Play para iniciar: "+entry.name))}
function render(){const q=filterEl.value.trim().toLowerCase();channelsEl.textContent="";const filtered=entries.filter(x=>(x.name+" "+x.group).toLowerCase().includes(q));for(const entry of filtered){const b=document.createElement("button");b.type="button";b.className="channel";b.dataset.url=entry.url;const img=document.createElement("img");img.alt="";img.loading="lazy";img.referrerPolicy="no-referrer";if(entry.logo)img.src=entry.logo;const span=document.createElement("span");span.textContent=entry.name;const small=document.createElement("small");small.textContent=entry.group;span.appendChild(small);b.append(img,span);b.addEventListener("click",()=>play(entry));channelsEl.appendChild(b)}setStatus(filtered.length+" canales visibles · "+entries.length+" totales")}
async function loadPlaylist(){destroy();entries=[];render();const selected=playlists.find(x=>x[0]===playlistEl.value)||playlists[0],url=base+selected[2];rawLink.href=url;setStatus("Cargando "+selected[1]+"…");try{const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);entries=parseM3U(await r.text());if(!entries.length)throw new Error("No se encontraron entradas M3U.");render();setStatus(entries.length+" canales cargados.")}catch(e){setStatus("❌ No se pudo cargar la playlist: "+e.message)}}
playlistEl.addEventListener("change",loadPlaylist);filterEl.addEventListener("input",render);document.getElementById("reload").addEventListener("click",loadPlaylist);loadPlaylist();
})();
</script></body></html>
