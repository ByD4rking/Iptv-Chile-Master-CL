<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPTV Chile — Player Beta</title>
<meta name="description" content="Reproductor web para las playlists IPTV Chile de la beta.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff}header{padding:18px 20px;border-bottom:1px solid #25304a;background:#11182b}h1{margin:0 0 5px;font-size:1.25rem}.sub{color:#aeb8d0;font-size:.9rem}main{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 76px)}aside{border-right:1px solid #25304a;padding:14px;overflow:auto}section{padding:18px;min-width:0}select,input,button{width:100%;padding:10px;border-radius:9px;border:1px solid #33415f;background:#151e34;color:#eef2ff}button{cursor:pointer;margin-top:8px}.toolbar{display:grid;gap:8px;margin-bottom:12px}#channels{display:grid;gap:6px}.channel{text-align:left;display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center}.channel img{width:36px;height:36px;object-fit:contain;background:#0b1020;border-radius:7px}.channel small{display:block;color:#9eabc6;margin-top:2px}.channel.active{outline:2px solid #5b8cff}video{width:100%;max-height:70vh;background:#000;border-radius:12px;display:block}.status{margin:10px 0;color:#aeb8d0;min-height:22px}.meta{margin-top:10px;color:#9eabc6;font-size:.9rem}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.links a{color:#9dc0ff}@media(max-width:850px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #25304a;max-height:42vh}}
</style></head>
<body><header><h1>📺 IPTV Chile — Player Beta</h1><div class="sub">Reproduce las playlists beta sin modificar las listas originales.</div></header>
<main><aside><div class="toolbar"><label for="playlist">Playlist</label><select id="playlist"></select><input id="filter" type="search" placeholder="Buscar canal…"><button id="reload" type="button">↻ Recargar playlist</button></div><div id="channels"></div></aside>
<section><video id="video" controls playsinline preload="metadata"></video><div id="status" class="status">Selecciona una playlist.</div><div id="meta" class="meta"></div><div class="links"><a id="rawLink" target="_blank" rel="noopener noreferrer">Abrir M3U raw</a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" crossorigin="anonymous"></script>
<script src="app.js" defer></script>
</body></html>
