name: Actualizar y verificar listas IPTV

on:
  schedule:
    # Cada 6 horas
    - cron: "0 */6 * * *"

  # Permite ejecutarlo manualmente desde GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================================
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. CONFIGURAR PYTHON
      # ==========================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # 3. INSTALAR DEPENDENCIAS
      # ==========================================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ==========================================================
      # 4. ACTUALIZAR LISTA PRINCIPAL
      # ==========================================================
      - name: Actualizar lista principal
        run: |
          python scripts/alimentar_principal.py

      # ==========================================================
      # 5. UNIFICAR CHILE
      # ==========================================================
      - name: Unificar categoría CHILE
        run: |
          python scripts/unificar_chile.py

      # ==========================================================
      # 6. GENERAR LISTA GOD
      # ==========================================================
      - name: Generar lista GOD
        run: |
          python scripts/mega_lista.py

      # ==========================================================
      # 7. COMPROBAR QUE EXISTEN LAS DOS LISTAS
      # ==========================================================
      - name: Comprobar listas generadas
        run: |
          echo "Comprobando listas..."

          test -f IPTV-CHILE-MAESTRA_CORREGIDO.m3u
          test -f IPTV-CHILE-MAESTRA_GOD.m3u

          echo "Las dos listas existen correctamente."

      # ==========================================================
      # 8. COMPROBAR QUE NO ESTÁN VACÍAS
      # ==========================================================
      - name: Validar contenido de las listas
        run: |
          echo "Validando cantidad de canales..."

          PRINCIPAL=$(grep -c "^#EXTINF" IPTV-CHILE-MAESTRA_CORREGIDO.m3u || true)
          GOD=$(grep -c "^#EXTINF" IPTV-CHILE-MAESTRA_GOD.m3u || true)

          echo "Lista principal: $PRINCIPAL canales"
          echo "Lista GOD:       $GOD canales"

          if [ "$PRINCIPAL" -eq 0 ]; then
            echo "ERROR: La lista principal está vacía."
            exit 1
          fi

          if [ "$GOD" -eq 0 ]; then
            echo "ERROR: La lista GOD está vacía."
            exit 1
          fi

      # ==========================================================
      # 9. VERIFICAR LAS DOS LISTAS
      # ==========================================================
      - name: Verificar lista principal y lista GOD
        run: |
          python scripts/generar_reporte.py \
            IPTV-CHILE-MAESTRA_CORREGIDO.m3u \
            IPTV-CHILE-MAESTRA_GOD.m3u \
            --hilos 50 \
            --timeout 6 \
            --max-por-servidor 1 \
            --reintentos 1 \
            --espera-reintento 1

      # ==========================================================
      # 10. COMPROBAR QUE SE GENERÓ EL REPORTE
      # ==========================================================
      - name: Comprobar reporte
        run: |
          if [ ! -f REPORTE.md ]; then
            echo "ERROR: No se generó REPORTE.md"
            exit 1
          fi

          echo "REPORTE.md generado correctamente."

      # ==========================================================
      # 11. MOSTRAR RESUMEN
      # ==========================================================
      - name: Mostrar resumen
        run: |
          echo "=========================================="
          echo " ACTUALIZACIÓN IPTV COMPLETADA"
          echo "=========================================="

          echo ""
          echo "Lista principal:"
          grep -c "^#EXTINF" IPTV-CHILE-MAESTRA_CORREGIDO.m3u || true

          echo ""
          echo "Lista GOD:"
          grep -c "^#EXTINF" IPTV-CHILE-MAESTRA_GOD.m3u || true

          echo ""
          echo "=========================================="
          echo " FIN DE VERIFICACIÓN"
          echo "=========================================="

      # ==========================================================
      # 12. GUARDAR CAMBIOS
      # ==========================================================
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV-CHILE-MAESTRA_CORREGIDO.m3u
          git add IPTV-CHILE-MAESTRA_GOD.m3u
          git add REPORTE.md
          git add scripts/aprendizaje.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git commit -m "Actualización y verificación automática IPTV"

          git pull --rebase origin main

          git push origin main
