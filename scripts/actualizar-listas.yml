name: Actualizar listas IPTV

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Actualizar lista principal
        run: |
          python scripts/alimentar_principal.py

      - name: Unificar categoría CHILE
        run: |
          python scripts/unificar_chile.py

      - name: Generar lista GOD
        run: |
          python scripts/mega_lista.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV-CHILE-MAESTRA_CORREGIDO.m3u
          git add IPTV-CHILE-MAESTRA_GOD.m3u
          git add scripts/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git commit -m "Actualización automática de listas IPTV"

          git pull --rebase origin main
          git push origin main
