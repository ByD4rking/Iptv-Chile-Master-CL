name: TV Platforms Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'TV/**'
      - '.github/workflows/tv-platforms.yml'

permissions:
  contents: read

jobs:
  firetv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TV/firetv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: firetv-apk
          path: TV/firetv/app/build/outputs/apk/debug/*.apk

  webos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global @webos-tools/cli
      - run: bash TV/webos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: TV/webos/*.ipk

  tizen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Tizen Studio
        run: |
          if [ -z "${TIZEN_SDK_ROOT:-}" ] || [ ! -x "$TIZEN_SDK_ROOT/tools/ide/bin/tizen" ]; then
            echo "Tizen Studio no está disponible en el runner hospedado."
            echo "El paquete se construye con TV/tizen/package.sh en un runner que tenga Tizen Studio."
            exit 78
          fi
      - run: bash TV/tizen/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: TV/tizen/.out/*.wgt

  static:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          test -s TV/shared/player.js
          grep -F 'IPTV-CHILE-GENERADOR.m3u' TV/shared/player.js
          echo "TV player smoke test: OK"
