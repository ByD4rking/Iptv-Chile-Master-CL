name: Validar sincronización IPTV en rama

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"
      - "pluto/src/**"
      - "pluto/requirements.txt"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: validar-iptv-${{ github.ref }}
  # Esperar a que termine la validación activa; no cancelarla por un push nuevo.
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar rama
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install -r pluto/requirements.txt
      - name: Probar serialización de publicación principal y Pluto
        run: python -m unittest scripts.test_workflow_publication -v
      - name: Validar generador Pluto y renovación obligatoria de JWT
        run: |
          set -e
          python pluto/src/selftest.py
          python -m unittest discover -s pluto/src -p 'test_*.py' -v
      - name: Validar sintaxis
        run: |
          python -m py_compile scripts/auditar_fuentes.py scripts/test_auditar_fuentes.py scripts/sincronizar_complementos.py scripts/ejecutar_actualizacion_principal.py
          python -m py_compile scripts/alimentar_principal.py scripts/blindajes_principal.py scripts/test_history_documentales.py scripts/test_m3ucl_resilience.py
      - name: Probar reintentos seguros M3U.CL
        run: python -m unittest scripts.test_m3ucl_resilience -v
      - name: Probar auditoría histórica de fuentes
        run: python -m unittest scripts.test_auditar_fuentes -v
      - name: Probar sincronización complementaria
        run: python -m unittest discover -s scripts -p 'test_sincronizar_complementos.py' -v
      - name: Probar identidad Pluto
        run: python -m unittest scripts.test_pluto_identity_validation -v
      - name: Probar orden History en Documentales y Cultura
        run: python -m unittest scripts.test_history_documentales -v
      - name: Auditar fuentes publicables y GOD de solo lectura por separado
        run: python scripts/auditar_fuentes.py --scope principal
      - name: Ejecutar reconciliación real y auditar la playlist resultante
        run: python scripts/selftest_sincronizacion_real.py
