name: Actualizar IPTV Chile Master

on:
  schedule:
    - cron: "0 6,18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Actualizar lista principal
        run: |
          python scripts/actualizar_principal.py

      - name: Generar lista GOD
        run: |
          python scripts/mega_lista.py

      - name: Generar reporte y actualizar aprendizaje
        run: |
          python scripts/generar_reporte.py --salida REPORTE.md

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizacion automatica de IPTV"
            git push
          fi
