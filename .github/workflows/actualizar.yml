name: Actualizar y verificar listas IPTV

on:
  push:
    paths:
      - "pluto/output/playlists/**"
      - "scripts/**"
      - "pluto/src/**"
      - ".github/workflows/actualizar.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-maintenance
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install requests

      - name: Validar sintaxis de scripts
        run: |
          python -m py_compile \
            scripts/alimentar_principal.py \
            scripts/unificar_chile.py \
            scripts/mega_lista.py \
            scripts/generar_reporte.py

      - name: Guardar estado previo de la principal
        run: |
          cp IPTV-CHILE-MAESTRA_CORREGIDO.m3u /tmp/principal_before.m3u
          grep '^#EXTINF' IPTV-CHILE-MAESTRA_CORREGIDO.m3u | sed -n 's/.*$//p' >/dev/null

      - name: Actualizar lista principal
        run: |
          python scripts/alimentar_principal.py

      - name: Unificar categoría CHILE
        run: |
          python scripts/unificar_chile.py

      - name: Generar lista GOD
        run: |
          python scripts/mega_lista.py

      - name: Auditoría de no regresión
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          before = Path("/tmp/principal_before.m3u").read_text(encoding="utf-8-sig")
          after = Path("IPTV-CHILE-MAESTRA_CORREGIDO.m3u").read_text(encoding="utf-8-sig")

          def entries(text):
              out=[]
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if line.startswith("#EXTINF:"):
                      j=i+1
                      while j < len(lines) and lines[j].startswith("#"):
                          j += 1
                      if j < len(lines) and lines[j].startswith(("http://","https://")):
                          out.append((line, lines[j].strip()))
              return out

          b=entries(before); a=entries(after)
          b_urls={u for _,u in b}; a_urls=[u for _,u in a]
          a_set=set(a_urls)

          # Una URL no-Pluto existente no puede desaparecer, salvo limpiezas
          # explícitas ya definidas por el proyecto (TOTAL/OTROS, categorías
          # Telemundo/Sky mal clasificadas y países no autorizados).
          allowed_cleanup = {
              "total", "otros", "telemundo noticias", "sky sports",
              "qatar", "palestina", "corea del norte", "corea del sur",
              "israel", "alemania", "francia", "iran", "rusia",
              "guinea ecuatorial", "estados unidos",
          }
          before_by_url={}
          for ext,url in b:
              m=re.search(r'group-title="([^"]*)"', ext)
              before_by_url.setdefault(url, m.group(1).strip().lower() if m else "")

          lost_non_pluto=[]
          for url in b_urls:
              if "pluto" in url.lower() or url in a_set:
                  continue
              if before_by_url.get(url,"") in allowed_cleanup:
                  continue
              lost_non_pluto.append(url)

          if lost_non_pluto:
              raise SystemExit("REGRESION: se perdieron URLs no-Pluto existentes fuera de limpiezas autorizadas: "+str(sorted(lost_non_pluto)[:20]))

          # Una URL de acceso solo puede aparecer una vez.
          dup=sorted(u for u in set(a_urls) if a_urls.count(u)>1)
          if dup:
              raise SystemExit("REGRESION: URLs duplicadas en principal: "+str(dup[:20]))

          # No se pueden recrear carpetas prohibidas.
          cats=[re.search(r'group-title="([^"]*)"',line) for line,_ in a]
          cats={m.group(1).strip().lower() for m in cats if m}
          forbidden={"pluto tv","total","otros"}
          bad=sorted(c for c in cats if c in forbidden)
          if bad:
              raise SystemExit("REGRESION: carpetas prohibidas: "+str(bad))

          print(f"Principal antes: {len(b)} | después: {len(a)}")
          print(f"URLs no-Pluto preservadas: {len(b_urls)-len(lost_non_pluto)}")
          print("OK: no-regresión, sin duplicados URL y sin carpetas prohibidas.")
          PY

      - name: Validar aprendizaje
        run: |
          python scripts/aprendizaje.py
          if [ -f scripts/aprendizaje.json ]; then
            TAMANO=$(wc -c < scripts/aprendizaje.json)
            echo "Tamaño aprendizaje.json: $TAMANO bytes"
            if [ "$TAMANO" -ge 5000000 ]; then
              echo "ERROR: el historial de aprendizaje superó 5 MB."
              exit 1
            fi
          fi
          echo "Aprendizaje persistente validado."

      - name: Validar archivos M3U
        run: |
          set -e

          for archivo in \
            "IPTV-CHILE-MAESTRA_CORREGIDO.m3u" \
            "IPTV-CHILE-MAESTRA_GOD.m3u"
          do
            echo "========================================"
            echo "Validando: $archivo"
            echo "========================================"

            if [ ! -f "$archivo" ]; then
              echo "ERROR: No existe $archivo"
              exit 1
            fi

            if [ ! -s "$archivo" ]; then
              echo "ERROR: $archivo está vacío"
              exit 1
            fi

            if ! head -n 1 "$archivo" | grep -q "#EXTM3U"; then
              echo "ERROR: $archivo no parece un M3U válido"
              exit 1
            fi

            CANALES=$(grep -c "^#EXTINF" "$archivo" || true)

            echo "Canales encontrados: $CANALES"

            if [ "$CANALES" -eq 0 ]; then
              echo "ERROR: $archivo no contiene canales"
              exit 1
            fi
          done

          echo "Las dos listas M3U son válidas."

      - name: Motor Health Score independiente de la principal
        run: |
          set -e
          python scripts/health_principal.py IPTV-CHILE-MAESTRA_CORREGIDO.m3u
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("scripts/health/principal_health.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("ERROR: estado de health principal inválido")
          if len(data) > 5000:
              raise SystemExit("ERROR: health principal superó el límite de 5000 fuentes")
          scores = [int(v.get("health_score", 0)) for v in data.values()]
          if scores and min(scores) < 0 or scores and max(scores) > 100:
              raise SystemExit("ERROR: Health Score fuera de 0-100")
          print(f"Health principal: {len(data)} fuentes; OK={sum(1 for v in data.values() if v.get('ok'))}; cooldown={sum(1 for v in data.values() if v.get('state') == 'COOLDOWN')}")
          PY

      - name: Verificar lista principal
        run: |
          python scripts/generar_reporte.py \
            IPTV-CHILE-MAESTRA_CORREGIDO.m3u \
            --hilos 100 \
            --timeout 4 \
            --max-por-servidor 1 \
            --reintentos 0 \
            --espera-reintento 0

      - name: Comprobar resultado de verificación
        run: |
          set -e

          if [ ! -f "REPORTE.md" ]; then
            echo "ERROR: No se generó REPORTE.md"
            exit 1
          fi

          echo "Reporte generado correctamente."

          echo ""
          echo "========== RESUMEN =========="

          for archivo in \
            "IPTV-CHILE-MAESTRA_CORREGIDO.m3u" \
            "IPTV-CHILE-MAESTRA_GOD.m3u"
          do
            CANALES=$(grep -c "^#EXTINF" "$archivo" || true)
            echo "$archivo -> $CANALES canales"
          done

          echo ""
          echo "Verificación completada."

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            IPTV-CHILE-MAESTRA_CORREGIDO.m3u \
            IPTV-CHILE-MAESTRA_GOD.m3u \
            REPORTE.md \
            scripts/aprendizaje.json \
            scripts/health/principal_health.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git commit -m "Actualización y verificación automática IPTV"

          # Otra ejecución/commit puede haber avanzado main durante la
          # verificación (que tarda bastante). Rebasamos de forma segura.
          # Los archivos de resultado secundarios pueden tomar la versión
          # remota si entran en conflicto; si hay conflicto en las M3U,
          # se detiene en lugar de sobrescribir canales.
          for intento in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin main; then
                exit 0
              fi
            else
              conflictos=$(git status --porcelain | awk '{print $2}')
              solo_secundarios=true
              for archivo in $conflictos; do
                case "$archivo" in
                  REPORTE.md|scripts/aprendizaje.json) ;;
                  *) solo_secundarios=false ;;
                esac
              done

              if [ "$solo_secundarios" = true ] && [ -n "$conflictos" ]; then
                git checkout --theirs -- REPORTE.md scripts/aprendizaje.json
                git add REPORTE.md scripts/aprendizaje.json
                GIT_EDITOR=true git rebase --continue
                if git push origin main; then
                  exit 0
                fi
              else
                echo "ERROR: conflicto en archivos de lista o código; no se sobrescribe nada."
                git rebase --abort || true
                exit 1
              fi
            fi

            sleep 5
          done

          echo "ERROR: no se pudo publicar tras 3 intentos."
          exit 1

      - name: Resumen final
        run: |
          echo "=========================================="
          echo " ACTUALIZACIÓN IPTV COMPLETADA"
          echo "=========================================="
          echo "Las listas fueron generadas y verificadas."
          echo "El resultado fue guardado en GitHub."


