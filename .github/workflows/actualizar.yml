        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install requests

      - name: Validar sintaxis de scripts
        run: |
          python -m py_compile \
            scripts/alimentar_principal.py \
            scripts/ejecutar_actualizacion_principal.py \
            scripts/sincronizar_complementos.py \
            scripts/test_sincronizar_complementos.py \
            scripts/unificar_chile.py \
            scripts/mega_lista.py \
            scripts/generar_reporte.py \
            scripts/health_principal.py \
            scripts/selftest_health_principal.py \
            scripts/selftest_reconexion_principal.py

      - name: Pruebas de sincronización incremental
        run: |
          python -m unittest discover -s scripts -p 'test_sincronizar_complementos.py'

      - name: Blindaje canónico de GOD
        run: |
          set -euo pipefail
          python IPTV-CHILE-GENERADOR/scripts/guard.py
          echo "OK: GOD protegida; solo se permiten las directivas de reconexión autorizadas."

      - name: Guardar estado previo de la principal
        run: |
          cp IPTV-CHILE-MAESTRA_CORREGIDO.m3u /tmp/principal_before.m3u
          sha256sum IPTV-CHILE-MAESTRA_GOD.m3u > /tmp/god_before.sha256
          find IPTV-CHILE-GENERADOR -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/generador_before.sha256
          find pluto/output/playlists -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pluto_before.sha256
          grep '^#EXTINF' IPTV-CHILE-MAESTRA_CORREGIDO.m3u | sed -n 's/.*$//p' >/dev/null

      - name: Actualizar lista principal con sincronización unificada
        run: |
          python scripts/ejecutar_actualizacion_principal.py

      - name: Unificar categoría CHILE
        run: |
          python scripts/unificar_chile.py

      - name: Reconciliación final de todas las fuentes complementarias
        run: |
          python scripts/sincronizar_complementos.py

      - name: Auditoría de no regresión
        run: |
          python - <<'PY'
