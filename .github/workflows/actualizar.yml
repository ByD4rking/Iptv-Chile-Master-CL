name: Actualizar y verificar listas IPTV

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/actualizar.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/actualizar.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-maintenance
  # Un run nuevo hace obsoleto al anterior: evita consumir el runner durante
  # decenas de minutos con una versión anterior del Health Score.
  cancel-in-progress: true

jobs:
  probar_sincronizacion:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar cambios de la PR
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install requests

      - name: Compilar sincronizador y pruebas
        run: |
          python -m py_compile scripts/alimentar_principal.py scripts/sincronizar_complementos.py scripts/test_sincronizar_complementos.py

      - name: Ejecutar pruebas de sincronización
        run: python -m unittest discover -s scripts -p 'test_sincronizar_complementos.py'

      - name: Guardar principal y listas protegidas para auditoría
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          main = Path("IPTV-CHILE-MAESTRA_CORREGIDO.m3u")
          shutil.copy2(main, "/tmp/principal_antes.m3u")
          protected = [
              Path("IPTV-CHILE-MAESTRA_GOD.m3u"),
              Path("IPTV-CHILE-GENERADOR/IPTV-CHILE-GENERADOR.m3u"),
              *sorted(Path("pluto/output/playlists").glob("*.m3u")),
          ]
          hashes = {
              str(path): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in protected if path.is_file()
          }
          Path("/tmp/listas_protegidas.json").write_text(
              json.dumps(hashes, ensure_ascii=False), encoding="utf-8"
          )
          print("Principal inicial:", sum(1 for line in main.read_text(encoding="utf-8-sig").splitlines() if line.startswith("#EXTINF:")))
          print("Archivos protegidos:", len(hashes))
          PY

      - name: Ejecutar sincronización real en el checkout de prueba
        run: python scripts/sincronizar_complementos.py

      - name: Auditar resultado real sin publicar
        run: |
          python - <<'PY'
          import hashlib, json, re
          from collections import Counter
          from pathlib import Path

          def norm(value):
              import unicodedata
              value = unicodedata.normalize("NFD", value or "")
              value = "".join(ch for ch in value if unicodedata.category(ch) != "Mn")
              return " ".join(value.lower().split())

          def entries(path):
              lines = Path(path).read_text(encoding="utf-8-sig", errors="replace").splitlines()
              result = []
              for index, line in enumerate(lines):
                  if not line.startswith("#EXTINF:"):
                      continue
                  match_id = re.search(r'tvg-id="([^"]*)"', line, re.I)
                  match_name = re.search(r'tvg-name="([^"]*)"', line, re.I)
                  match_group = re.search(r'group-title="([^"]*)"', line, re.I)
                  display = line.split(",", 1)[1].strip() if "," in line else ""
                  name = (match_name.group(1) if match_name else display).strip()
                  base = re.sub(r'\s*(?:\[\s*opc(?:ion)?\.?\s*\d+\s*\]|\(\s*opci[oó]n\s*\d+\s*\))\s*
  actualizar:
    # Este workflow publica en main; no ejecutar desde ramas de trabajo.
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

