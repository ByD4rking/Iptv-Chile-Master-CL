name: Validar mejora de estabilidad de streams

on:
  push:
    branches:
      - mejora-estabilidad-streams
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-estabilidad
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install requests

      - name: Sintaxis
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path("IPTV-CHILE-GENERADOR/scripts")
          for path in sorted(root.glob("*.py")):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"OK: {path}")
          PY

      - name: Tests estructurales
        run: |
          python IPTV-CHILE-GENERADOR/tests/test_m3u_inventory.py
          python IPTV-CHILE-GENERADOR/tests/test_teleon_classifier.py
          python IPTV-CHILE-GENERADOR/scripts/guard.py

      - name: Ejecutar pipeline completo sin publicar
        run: |
          set -euo pipefail
          python IPTV-CHILE-GENERADOR/scripts/aplicar_reconexion_god.py
          python IPTV-CHILE-GENERADOR/scripts/guard.py
          python IPTV-CHILE-GENERADOR/scripts/teleon_discovery.py
          python IPTV-CHILE-GENERADOR/scripts/teleon_validate.py
          python IPTV-CHILE-GENERADOR/scripts/collect.py
          python IPTV-CHILE-GENERADOR/scripts/fix_encoding.py
          python IPTV-CHILE-GENERADOR/scripts/check.py
          python IPTV-CHILE-GENERADOR/scripts/quality.py
          python IPTV-CHILE-GENERADOR/scripts/generate.py
          python IPTV-CHILE-GENERADOR/scripts/teleon_publish.py
          python IPTV-CHILE-GENERADOR/scripts/selftest.py

      - name: Verificar que la mejora realmente exige continuidad HLS
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          quality = json.loads(
              Path("IPTV-CHILE-GENERADOR/data/quality.json").read_text(encoding="utf-8-sig")
          )
          hls = [x for x in quality["results"] if x.get("playback_type") == "hls"]
          stable = [x for x in hls if x.get("stability_ok")]
          print(f"HLS evaluados: {len(hls)}")
          print(f"HLS con continuidad validada: {len(stable)}")
          if hls and len(stable) == 0:
              raise SystemExit("ERROR: ningún HLS superó la prueba de continuidad.")
          for item in stable[:10]:
              assert item.get("stability_segments_checked", 0) >= 3
          PY

      - name: Verificar aislamiento
        run: |
          set -euo pipefail
          python IPTV-CHILE-GENERADOR/scripts/guard.py

          while IFS= read -r line; do
            file="${line:3}"
            case "$file" in
              IPTV-CHILE-GENERADOR/*|IPTV-CHILE-MAESTRA_GOD.m3u)
                ;;
              "")
                ;;
              *)
                echo "REGRESION: archivo externo modificado: $file"
                exit 1
                ;;
            esac
          done < <(git status --porcelain)

          echo "OK: prueba sin publicación y con aislamiento."
