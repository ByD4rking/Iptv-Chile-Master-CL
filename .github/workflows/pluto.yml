name: Pluto TV - Actualizar canales

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pluto-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: pluto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar canales
        working-directory: pluto
        run: |
          python src/channels.py

      - name: Generar playlist
        working-directory: pluto
        run: |
          python src/playlist.py

      - name: Verificar playlist
        run: |
          test -s pluto/output/playlists/pluto.m3u
          grep -q '^#EXTM3U' pluto/output/playlists/pluto.m3u

          echo "Playlist generada:"
          wc -l pluto/output/playlists/pluto.m3u

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pluto/output/playlists/pluto.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios en la playlist."
            exit 0
          fi

          git commit -m "Actualizar playlist Pluto TV"
          git push
