name: Pluto TV - Actualizar listas regionales
# Ejecución automática cada hora + disparo por cambios del generador.

on:
  push:
    branches:
      - main
    paths:
      - "pluto/src/**"
      - "pluto/requirements.txt"
      - ".github/workflows/pluto.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pluto-maintenance
  cancel-in-progress: true


jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: pluto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recuperar playlists Pluto vacías desde el último estado válido
        run: |
          set -e
          for file in ar br cl es latam mx us; do
            path="pluto/output/playlists/pluto_$file.m3u"
            if [ -s "$path" ]; then
              continue
            fi

            echo "[$file] La playlist actual está vacía; buscando la última versión no vacía en el historial."
            recovered=0
            while IFS= read -r commit; do
              if [ -z "$commit" ]; then
                continue
              fi
              if git cat-file -e "$commit:$path" 2>/dev/null; then
                git show "$commit:$path" > "/tmp/pluto_$file.m3u.recovered" || true
                if [ -s "/tmp/pluto_$file.m3u.recovered" ] \
                  && grep -q '^#EXTM3U' "/tmp/pluto_$file.m3u.recovered" \
                  && grep -q '^#EXTINF:' "/tmp/pluto_$file.m3u.recovered" \
                  && grep -q '/master.m3u8' "/tmp/pluto_$file.m3u.recovered"; then
                  cp "/tmp/pluto_$file.m3u.recovered" "$path"
                  echo "[$file] Recuperada desde $commit: $(grep -c '^#EXTINF:' "$path") canales."
                  recovered=1
                  break
                fi
              fi
            done < <(git log --all --format=%H -- "$path")

            if [ "$recovered" -ne 1 ]; then
              echo "[$file] No existe una versión histórica no vacía; el generador deberá obtener un catálogo nuevo."
            fi
          done

      - name: Guardar inventario previo de canales
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          out = {}
          for path in sorted(Path("pluto/output/playlists").glob("pluto_*.m3u")):
              text = path.read_text(encoding="utf-8-sig", errors="replace")
              entries = []
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if not line.startswith("#EXTINF:"):
                      continue
                  id_match = re.search(r'tvg-id="([^"]+)"', line)
                  name_match = re.search(r'tvg-name="([^"]+)"', line)
                  if not id_match:
                      continue
                  name = name_match.group(1).strip().lower() if name_match else ""
                  name = re.sub(r"\s+", " ", name)
                  stream = ""
                  if i + 1 < len(lines):
                      candidate = lines[i + 1].strip()
                      if candidate.startswith(("http://", "https://")):
                          stream = candidate
                  entries.append({"id": id_match.group(1), "name": name, "stream": stream})
              out[path.name] = entries
          Path("/tmp/pluto_before.json").write_text(json.dumps(out), encoding="utf-8")
          print("Inventario previo:", {k: len(v) for k, v in out.items()})
          PY

      - name: Selftest estructural Pluto
        run: |
          set -e
          python pluto/src/selftest.py

      - name: Validar sintaxis y carga del servidor Pluto
        run: |
          set -e
          python -m compileall -q pluto/src
          cd pluto/src
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in sorted(Path(".").glob("*.py")):
              ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
              print(f"AST OK: {path}")
          from server import app
          routes = {rule.rule for rule in app.url_map.iter_rules()}
          required = {
              "/",
              "/channels",
              "/playlist.m3u",
              "/stream/<channel_id>",
              "/pluto-master/<channel_id>.m3u8",
              "/pluto-proxy/<channel_id>/<encoded_url>",
          }
          missing = required - routes
          if missing:
              raise SystemExit(f"RUTAS Pluto ausentes: {sorted(missing)}")
          print("IMPORT OK: server.py")
          print("RUTAS OK:", sorted(routes))
          PY

      - name: Proteger listas maestras
        run: |
          set -e
          git hash-object IPTV-CHILE-MAESTRA_CORREGIDO.m3u > /tmp/master_before.sha
          git hash-object IPTV-CHILE-MAESTRA_GOD.m3u > /tmp/god_before.sha
      - name: Generar listas Pluto por región
        working-directory: pluto
        run: |
          python src/generate_multiregion.py


      - name: Verificar que el generador no tocó archivos ajenos
        run: |
          set -euo pipefail
          git status --porcelain | while IFS= read -r line; do
            file="${line:3}"
            file="${file%/}"
            case "$file" in
              pluto/output/playlists/pluto_*.m3u|pluto/output/regional|pluto/output/regional/channels_*.json|pluto/output/health/streams.json|reportes/pluto/REPORTE.md)
                ;;
              "")
                ;;
              *)
                echo "REGRESION: el generador creó o modificó un archivo no autorizado: $file"
                exit 1
                ;;
            esac
          done

          git diff --name-only | while IFS= read -r file; do
            case "$file" in
              pluto/output/playlists/pluto_*.m3u|pluto/output/regional/channels_*.json|pluto/output/health/streams.json)
                ;;
              "")
                ;;
              *)
                echo "REGRESION: el generador modificó un archivo no autorizado: $file"
                exit 1
                ;;
            esac
          done

          test "$(git hash-object IPTV-CHILE-MAESTRA_CORREGIDO.m3u)" = "$(cat /tmp/master_before.sha)"
          test "$(git hash-object IPTV-CHILE-MAESTRA_GOD.m3u)" = "$(cat /tmp/god_before.sha)"
          echo "OK: MAESTRA y GOD permanecen intactas."
      - name: Verificar que ninguna región válida quedó vacía
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          for code in ("ar", "br", "cl", "es", "latam", "mx", "us"):
              path = Path(f"pluto/output/playlists/pluto_{code}.m3u")
              text = path.read_text(encoding="utf-8-sig") if path.exists() else ""
              count = len(re.findall(r"^#EXTINF:", text, re.MULTILINE))
              if count <= 0:
                  raise SystemExit(f"PROTECCION: {path} quedó vacía; se cancela la publicación.")
              print(f"{code.upper()}: {count} canales")
          PY

      - name: Verificar listas
        run: |
          set -e
          for file in ar br cl es latam mx us; do
            test -s "pluto/output/playlists/pluto_$file.m3u"
            grep -q '^#EXTM3U' "pluto/output/playlists/pluto_$file.m3u"
            echo "pluto_$file.m3u:"
            grep -c '^#EXTINF:' "pluto/output/playlists/pluto_$file.m3u"
          done

          python - <<'PY'
          from pathlib import Path
          import json, re
          allowed = {
              "pluto_ar.m3u", "pluto_br.m3u", "pluto_cl.m3u",
              "pluto_es.m3u", "pluto_latam.m3u", "pluto_mx.m3u",
              "pluto_us.m3u",
          }
          directory = Path("pluto/output/playlists")
          actual = {p.name for p in directory.glob("pluto_*.m3u")}
          extra = sorted(actual - allowed)
          if extra:
              raise SystemExit("Playlist Pluto no autorizada: " + ", ".join(extra))
          missing = sorted(allowed - actual)
          if missing:
              raise SystemExit("Playlist Pluto permitida ausente: " + ", ".join(missing))
          for name in sorted(allowed):
              path = directory / name
              text = path.read_text(encoding="utf-8-sig")
              assert text.startswith("#EXTM3U"), f"{name}: M3U inválido"
              assert re.search(r"^#EXTINF:", text, re.MULTILINE), f"{name}: sin canales"
              print(f"{name}: {len(re.findall(r'^#EXTINF:', text, re.MULTILINE))} canales")
              ids = re.findall(r'tvg-id="([^"]+)"', text)
              streams = [line.strip() for line in text.splitlines() if line.startswith(("http://", "https://"))]
              assert len(ids) == len(set(ids)), f"{name}: IDs duplicados"
              assert len(streams) == len(set(streams)), f"{name}: streams duplicados"
              assert all(".m3u8" in s for s in streams), f"{name}: hay streams que no son HLS m3u8"
              assert all("quality=1080p" not in s.lower() for s in streams), f"{name}: se forzó quality=1080p"
              assert all("/master.m3u8" in s for s in streams), f"{name}: no todos usan master.m3u8"
              print(f"{name}: validación de IDs, streams y master HLS OK")
          before = json.loads(Path("/tmp/pluto_before.json").read_text(encoding="utf-8"))
          for name, old_entries in before.items():
              if name not in allowed:
                  continue
              path = directory / name
              if not path.exists():
                  raise SystemExit(f"REGRESION: desapareció {name}")
              text = path.read_text(encoding="utf-8-sig")
              new_ids = set(re.findall(r'tvg-id="([^"]+)"', text))
              new_names = {
                  re.sub(r"\s+", " ", value.strip().lower())
                  for value in re.findall(r'tvg-name="([^"]+)"', text)
              }
              new_streams = {
                  line.strip()
                  for line in text.splitlines()
                  if line.startswith(("http://", "https://"))
              }
              missing = [
                  entry for entry in old_entries
                  if entry["id"] not in new_ids
                  and (not entry["name"] or entry["name"] not in new_names)
                  and (not entry["stream"] or entry["stream"] not in new_streams)
              ]
              if missing:
                  raise SystemExit(
                      f"REGRESION: {name} perdió {len(missing)} canales existentes "
                      f"(ID/nombre): {missing[:20]}"
                  )
              print(f"{name}: OK, conserva {len(old_entries)} canales anteriores (ID o nombre)")

          print("OK: las 7 listas Pluto están presentes y no se permite perder canales existentes.")
          PY

      - name: Generar reporte de Pluto
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          out = ['# 📡 Reporte de estado — Pluto TV', '', '## Playlists regionales', '']
          total = 0
          for code in ('ar','br','cl','es','latam','mx','us'):
              p = Path(f'pluto/output/playlists/pluto_{code}.m3u')
              text = p.read_text(encoding='utf-8-sig', errors='replace') if p.exists() else ''
              count = sum(1 for x in text.splitlines() if x.startswith('#EXTINF:'))
              streams = sum(1 for x in text.splitlines() if x.startswith(('http://','https://')))
              total += count
              out.append(f'- **{code.upper()}**: {count} canales, {streams} streams')
          health = Path('pluto/output/health/streams.json')
          if health.exists():
              try:
                  data = json.loads(health.read_text(encoding='utf-8'))
                  out += ['', '## Salud de streams', f'- Archivo: `{health.as_posix()}`', f'- Registros: **{len(data) if isinstance(data, dict) else 0}**']
              except Exception:
                  out += ['', '- ⚠️ streams.json no pudo resumirse como JSON.']
          out += ['', f'**Total de canales publicados: {total}**', '', 'Este reporte pertenece exclusivamente al pipeline Pluto y no modifica Principal, GOD ni Generador.']
          Path('reportes/pluto').mkdir(parents=True, exist_ok=True)
          Path('reportes/pluto/REPORTE.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Verificar exactamente lo que se va a publicar
        run: |
          set -e
          git add pluto/output/playlists/pluto_ar.m3u
          git add pluto/output/playlists/pluto_br.m3u
          git add pluto/output/playlists/pluto_cl.m3u
          git add pluto/output/playlists/pluto_es.m3u
          git add pluto/output/playlists/pluto_latam.m3u
          git add pluto/output/playlists/pluto_mx.m3u
          git add pluto/output/playlists/pluto_us.m3u
          git add pluto/output/health/streams.json
          git add reportes/pluto/REPORTE.md

          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          allowed = [
              "pluto_ar.m3u", "pluto_br.m3u", "pluto_cl.m3u",
              "pluto_es.m3u", "pluto_latam.m3u", "pluto_mx.m3u",
              "pluto_us.m3u",
          ]
          for name in allowed:
              path = Path("pluto/output/playlists") / name
              text = subprocess.check_output(["git", "show", f":{path}"], text=True, encoding="utf-8")
              count = len(re.findall(r"^#EXTINF:", text, re.MULTILINE))
              if not text.startswith("#EXTM3U") or count <= 0:
                  raise SystemExit(f"STAGED INVALIDO: {name}: {count} canales")
              streams = [line.strip() for line in text.splitlines() if line.startswith(("http://", "https://"))]
              if len(streams) != count:
                  raise SystemExit(f"STAGED INVALIDO: {name}: EXTINF={count}, streams={len(streams)}")
              if len(streams) != len(set(streams)):
                  raise SystemExit(f"STAGED INVALIDO: {name}: streams duplicados")
              if any("/master.m3u8" not in s or "quality=1080p" in s.lower() for s in streams):
                  raise SystemExit(f"STAGED INVALIDO: {name}: stream HLS no permitido")
              print(f"STAGED OK: {name}: {count} canales")
          print("OK: el contenido exacto que se publicará supera la barrera final.")
          PY

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pluto/output/playlists/pluto_ar.m3u
          git add pluto/output/playlists/pluto_br.m3u
          git add pluto/output/playlists/pluto_cl.m3u
          git add pluto/output/playlists/pluto_es.m3u
          git add pluto/output/playlists/pluto_latam.m3u
          git add pluto/output/playlists/pluto_mx.m3u
          git add pluto/output/playlists/pluto_us.m3u
          git add pluto/output/health/streams.json
          git add reportes/pluto/REPORTE.md

          if git diff --cached --quiet; then
            echo "No hay cambios en las playlists."
            exit 0
          fi

          git commit -m "Actualizar playlists Pluto TV regionales"

          # La generación puede tardar y otro proceso puede avanzar main.
          # Nunca se hace force-push ni se sobrescriben cambios remotos.
          for intento in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              echo "ERROR: conflicto durante publicación Pluto; no se sobrescribe el remoto."
              git rebase --abort || true
              exit 1
            fi
            sleep 5
          done

          echo "ERROR: no se pudo publicar Pluto después de 3 intentos."
          exit 1
