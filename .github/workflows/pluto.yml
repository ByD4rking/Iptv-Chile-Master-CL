name: Pluto TV - Actualizar listas regionales
# Ejecución automática cada 6 horas + disparo por cambios del generador.

on:
  push:
    paths:
      - "pluto/src/**"
      - "pluto/requirements.txt"
      - ".github/workflows/pluto.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-maintenance
  cancel-in-progress: false


jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: pluto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Guardar inventario previo de canales
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          out = {}
          for path in sorted(Path("pluto/output/playlists").glob("pluto_*.m3u")):
              text = path.read_text(encoding="utf-8-sig", errors="replace")
              ids = []
              for line in text.splitlines():
                  if line.startswith("#EXTINF:"):
                      m = re.search(r'tvg-id="([^"]+)"', line)
                      if m:
                          ids.append(m.group(1))
              out[path.name] = sorted(set(ids))
          Path("/tmp/pluto_before.json").write_text(json.dumps(out), encoding="utf-8")
          print("Inventario previo:", {k: len(v) for k, v in out.items()})
          PY

      - name: Generar listas Pluto por región
        working-directory: pluto
        run: |
          python src/generate_multiregion.py

      - name: Verificar listas
        run: |
          set -e
          for file in ar br cl es latam mx us; do
            test -s "pluto/output/playlists/pluto_$file.m3u"
            grep -q '^#EXTM3U' "pluto/output/playlists/pluto_$file.m3u"
            echo "pluto_$file.m3u:"
            grep -c '^#EXTINF:' "pluto/output/playlists/pluto_$file.m3u"
          done

          python - <<'PY'
          from pathlib import Path
          import re
          allowed = {
              "pluto_ar.m3u", "pluto_br.m3u", "pluto_cl.m3u",
              "pluto_es.m3u", "pluto_latam.m3u", "pluto_mx.m3u",
              "pluto_us.m3u",
          }
          directory = Path("pluto/output/playlists")
          actual = {p.name for p in directory.glob("pluto_*.m3u")}
          extra = sorted(actual - allowed)
          if extra:
              raise SystemExit("Playlist Pluto no autorizada: " + ", ".join(extra))
          missing = sorted(allowed - actual)
          if missing:
              raise SystemExit("Playlist Pluto permitida ausente: " + ", ".join(missing))
          for name in sorted(allowed):
              path = directory / name
              text = path.read_text(encoding="utf-8-sig")
              assert text.startswith("#EXTM3U"), f"{name}: M3U inválido"
              assert re.search(r"^#EXTINF:", text, re.MULTILINE), f"{name}: sin canales"
              print(f"{name}: {len(re.findall(r'^#EXTINF:', text, re.MULTILINE))} canales")
          before = json.loads(Path("/tmp/pluto_before.json").read_text(encoding="utf-8"))
          for name, old_ids in before.items():
              if name not in allowed:
                  continue
              path = directory / name
              if not path.exists():
                  raise SystemExit(f"REGRESION: desapareció {name}")
              text = path.read_text(encoding="utf-8-sig")
              new_ids = set(re.findall(r'tvg-id="([^"]+)"', text))
              missing = sorted(set(old_ids) - new_ids)
              if missing:
                  raise SystemExit(
                      f"REGRESION: {name} perdió {len(missing)} canales existentes: {missing[:20]}"
                  )
              print(f"{name}: OK, conserva {len(old_ids)} canales anteriores")

          print("OK: las 7 listas Pluto están presentes y no se permite perder canales existentes.")
          PY

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pluto/output/playlists/pluto_ar.m3u
          git add pluto/output/playlists/pluto_br.m3u
          git add pluto/output/playlists/pluto_cl.m3u
          git add pluto/output/playlists/pluto_es.m3u
          git add pluto/output/playlists/pluto_latam.m3u
          git add pluto/output/playlists/pluto_mx.m3u
          git add pluto/output/playlists/pluto_us.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios en las playlists."
            exit 0
          fi

          git commit -m "Actualizar playlists Pluto TV regionales"
          git push origin HEAD:main
