name: Pluto TV - Actualizar listas regionales
# Ejecución automática cada 6 horas + disparo por cambios del generador.

on:
  push:
    paths:
      - "pluto/src/**"
      - "pluto/requirements.txt"
      - ".github/workflows/pluto.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pluto-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: pluto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar listas Pluto por región
        working-directory: pluto
        run: |
          python src/generate_multiregion.py

      - name: Verificar listas
        run: |
          set -e
          for file in es mx latam; do
            test -s "pluto/output/playlists/pluto_$file.m3u"
            grep -q '^#EXTM3U' "pluto/output/playlists/pluto_$file.m3u"
            echo "pluto_$file.m3u:"
            grep -c '^#EXTINF:' "pluto/output/playlists/pluto_$file.m3u"
          done

          python - <<'PY'
          import re
          from collections import Counter
          for code in ("us", "all"):
              path = f"pluto/output/playlists/pluto_{code}.m3u"
              text = open(path, encoding="utf-8-sig").read()
              groups = Counter(
                  m.group(1)
                  for line in text.splitlines()
                  if line.startswith("#EXTINF:")
                  for m in [re.search(r'group-title="([^"]*)"', line)]
                  if m
              )
              print(f"[{code.upper()}] CATEGORIAS:", dict(groups))
              assert groups.get("Otros", 0) == 0, f"{code.upper()}: quedan canales en Otros"
          PY

          test -s pluto/output/playlists/pluto.m3u
          grep -q '^#EXTM3U' pluto/output/playlists/pluto.m3u

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pluto/output/playlists/pluto_es.m3u
          git add pluto/output/playlists/pluto_mx.m3u
          git add pluto/output/playlists/pluto_latam.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios en las playlists."
            exit 0
          fi

          git commit -m "Actualizar playlists Pluto TV regionales"
          git push origin HEAD:main
