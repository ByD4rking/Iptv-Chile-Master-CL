name: Validar sincronización complementaria

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/alimentar_principal.py"
      - "scripts/sincronizar_complementos.py"
      - "scripts/ejecutar_actualizacion_principal.py"
      - "scripts/test_sincronizar_complementos.py"
      - "scripts/selftest_sincronizacion_real.py"
      - ".github/workflows/validar-sincronizacion.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/alimentar_principal.py"
      - "scripts/sincronizar_complementos.py"
      - "scripts/ejecutar_actualizacion_principal.py"
      - "scripts/test_sincronizar_complementos.py"
      - "scripts/selftest_sincronizacion_real.py"
      - ".github/workflows/validar-sincronizacion.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install requests

      - name: Validar sintaxis
        run: |
          python -m py_compile \
            scripts/alimentar_principal.py \
            scripts/sincronizar_complementos.py \
            scripts/ejecutar_actualizacion_principal.py \
            scripts/test_sincronizar_complementos.py \
            scripts/selftest_sincronizacion_real.py

      - name: Ejecutar pruebas unitarias de sincronización
        run: python -m unittest discover -s scripts -p 'test_sincronizar_complementos.py' -v
