name: Validar sincronización complementaria

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/alimentar_principal.py"
      - "scripts/sincronizar_complementos.py"
      - "scripts/ejecutar_actualizacion_principal.py"
      - "scripts/test_sincronizar_complementos.py"
      - "scripts/selftest_sincronizacion_real.py"
      - "scripts/calidad_magma_cine.py"
      - "scripts/test_calidad_magma_cine.py"
      - ".github/workflows/validar-sincronizacion.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/alimentar_principal.py"
      - "scripts/sincronizar_complementos.py"
      - "scripts/ejecutar_actualizacion_principal.py"
      - "scripts/test_sincronizar_complementos.py"
      - "scripts/selftest_sincronizacion_real.py"
      - ".github/workflows/validar-sincronizacion.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install requests

      - name: Validar sintaxis
        run: |
          python -m py_compile \
            scripts/alimentar_principal.py \
            scripts/sincronizar_complementos.py \
            scripts/ejecutar_actualizacion_principal.py \
            scripts/test_sincronizar_complementos.py \
            scripts/selftest_sincronizacion_real.py \
            scripts/calidad_magma_cine.py \
            scripts/test_calidad_magma_cine.py

      - name: Probar filtro MAGMA 1080p 16:9
        run: python -m unittest discover -s scripts -p 'test_calidad_magma_cine.py' -v

      - name: Ejecutar pruebas unitarias de sincronización
        run: python -m unittest discover -s scripts -p 'test_sincronizar_complementos.py' -v

      - name: Guardar maestra original para comparar pérdidas y orden
        run: cp IPTV-CHILE-MAESTRA_CORREGIDO.m3u /tmp/principal_before.m3u

      - name: Ejecutar reconciliación completa y auditoría de la M3U (sin publicar)
        run: python scripts/ejecutar_actualizacion_principal.py

      - name: Auditar tokens, alternativas, categorías y orden de la maestra generada
        run: python scripts/selftest_sincronizacion_real.py --audit-only --before /tmp/principal_before.m3u

      - name: Guardar M3U resultante para auditoría (sin publicar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-principal-auditoria
          path: IPTV-CHILE-MAESTRA_CORREGIDO.m3u
          if-no-files-found: warn
          retention-days: 1
