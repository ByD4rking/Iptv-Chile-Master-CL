name: Validar generador Pluto sin publicar

on:
  push:
    branches:
      - "codex/**"
    paths:
      - "pluto/src/**"
      - "pluto/requirements.txt"
      - ".github/workflows/validar-pluto.yml"
  pull_request:
    branches:
      - main
    paths:
      - "pluto/src/**"
      - "pluto/requirements.txt"
      - ".github/workflows/validar-pluto.yml"

permissions:
  contents: read

concurrency:
  group: validar-pluto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-pluto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias Pluto
        run: python -m pip install -r pluto/requirements.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q pluto/src

      - name: Pruebas de orden, integridad M3U y fuentes
        working-directory: pluto/src
        run: python -m unittest discover -v -p 'test_*.py'

      - name: Generación real contra la API Pluto (sin publicar)
        timeout-minutes: 20
        env:
          PLUTO_OUTPUT_DIR: ${{ runner.temp }}/pluto-live-output
          PLUTO_SKIP_HEALTH: "1"
        run: |
          set -euo pipefail
          python pluto/src/generate_multiregion.py
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path(__import__("os").environ["PLUTO_OUTPUT_DIR"]) / "playlists"
          total = 0
          for region in ("ar", "br", "cl", "es", "latam", "mx", "us"):
              path = root / f"pluto_{region}.m3u"
              if not path.is_file():
                  raise SystemExit(f"LIVE API FAIL: falta {path.name}")
              text = path.read_text(encoding="utf-8-sig")
              entries = re.findall(r"^#EXTINF:", text, re.MULTILINE)
              ids = re.findall(r'tvg-id="([^"]+)"', text)
              streams = [line.strip() for line in text.splitlines() if line.strip().startswith(("http://", "https://"))]
              if not text.startswith("#EXTM3U") or not entries:
                  raise SystemExit(f"LIVE API FAIL: {region.upper()} generó {len(entries)} canales")
              if len(entries) != len(streams):
                  raise SystemExit(f"LIVE API FAIL: {region.upper()} EXTINF={len(entries)}, streams={len(streams)}")
              if len(ids) != len(set(ids)) or len(streams) != len(set(streams)):
                  raise SystemExit(f"LIVE API FAIL: {region.upper()} tiene IDs o streams duplicados")
              for stream in streams:
                  parsed = urlsplit(stream)
                  if parsed.scheme not in {"http", "https"} or not parsed.hostname or not parsed.path.lower().endswith(".m3u8"):
                      raise SystemExit(f"LIVE API FAIL: URL HLS inválida en {region.upper()}: {stream[:100]}")
              total += len(entries)
              print(f"LIVE API OK: {region.upper()}={len(entries)} canales, {len(set(streams))} streams únicos")
          print(f"LIVE API OK: {total} entradas regionales generadas; archivos solo en directorio temporal, sin publicar.")
          PY

      - name: Autoprueba estructural Pluto
        run: python pluto/src/selftest.py
