name: IPTV Chile Generador - aislado
# Pipeline de estabilidad: reintentos/backoff + selftest de regresión.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "IPTV-CHILE-GENERADOR/**"
      - ".github/workflows/generador.yml"
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  # Evita cancelar una auditoría de calidad en curso. Los cambios nuevos
  # esperan su turno para no dejar snapshots parciales.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generar:
    # Evita el bucle push -> Actions -> commit -> Actions.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validar sintaxis
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path("IPTV-CHILE-GENERADOR/scripts")
          for path in sorted(root.glob("*.py")):
              source = path.read_text(encoding="utf-8")
              ast.parse(source, filename=str(path))
              print(f"OK: {path}")
          PY

      - name: Prueba inventario M3U del generador
        run: python IPTV-CHILE-GENERADOR/tests/test_m3u_inventory.py

      - name: Pruebas unitarias Teleon
        run: python IPTV-CHILE-GENERADOR/tests/test_teleon_classifier.py

      - name: Inventariar M3U generada sin reingestión
        run: python IPTV-CHILE-GENERADOR/scripts/m3u_inventory.py

      - name: Guardar huellas protegidas
        run: |
          set -euo pipefail
          mkdir -p /tmp/generador-guard
          sha256sum IPTV-CHILE-MAESTRA_CORREGIDO.m3u > /tmp/generador-guard/maestras.sha256
          find pluto/output/playlists -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/generador-guard/pluto.sha256
          find scripts -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/generador-guard/scripts.sha256

      - name: Auditar aislamiento inicial
        run: python IPTV-CHILE-GENERADOR/scripts/guard.py

      - name: Aplicar reconexión y estabilidad a GOD
        run: python IPTV-CHILE-GENERADOR/scripts/aplicar_reconexion_god.py

      - name: Verificar GOD tras aplicar reconexión
        run: python IPTV-CHILE-GENERADOR/scripts/guard.py

      - name: Descubrir candidatos Teleon
        run: python IPTV-CHILE-GENERADOR/scripts/teleon_discovery.py

      - name: Validar HLS explícitos de Teleon
        run: python IPTV-CHILE-GENERADOR/scripts/teleon_validate.py

      - name: Recopilar fuentes independientes
        run: python IPTV-CHILE-GENERADOR/scripts/collect.py

      - name: Corregir codificación
        run: python IPTV-CHILE-GENERADOR/scripts/fix_encoding.py

      - name: Comprobar streams
        run: python IPTV-CHILE-GENERADOR/scripts/check.py

      - name: Analizar calidad
        run: python IPTV-CHILE-GENERADOR/scripts/quality.py

      - name: Generar M3U
        run: python IPTV-CHILE-GENERADOR/scripts/generate.py

      - name: Añadir directamente a la M3U los Teleon validados
        run: python IPTV-CHILE-GENERADOR/scripts/teleon_publish.py

      - name: Self-test del generador
        run: python IPTV-CHILE-GENERADOR/scripts/selftest.py

      - name: Generar reporte del Generador
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base = Path('IPTV-CHILE-GENERADOR/data')
          def load(name):
              p = base / name
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          manifest = load('pipeline_manifest.json')
          quality = load('quality.json')
          status = load('status.json')
          teleon = load('teleon_quality.json')
          m3u = Path('IPTV-CHILE-GENERADOR/IPTV-CHILE-GENERADOR.m3u').read_text(encoding='utf-8-sig', errors='replace')
          urls = [x.strip() for x in m3u.splitlines() if x.strip().startswith(('http://','https://'))]
          lines = [
              '# ⚙️ Reporte de estado — IPTV-CHILE-GENERADOR',
              '',
              f'- Canales publicados: **{len(urls)}**',
              f'- URLs únicas: **{len(set(urls))}**',
              f'- Candidatos evaluados: **{quality.get("endpoint_candidates", 0)}**',
              f'- Playback OK: **{quality.get("playback_ok", 0)}**',
              f'- Manifest generado: **{manifest.get("generated_channels", 0)} canales**',
              f'- Teleon candidatos validados: **{teleon.get("total_candidates", 0)}**',
              f'- Teleon playback OK: **{teleon.get("playback_ok", 0)}**',
              f'- Fuentes con estado: **{len(status.get("results", [])) if isinstance(status.get("results"), list) else 0}**',
              '',
              'Este reporte pertenece exclusivamente al pipeline Generador y no publica ni modifica Principal, GOD o Pluto.',
          ]
          Path('reportes/generador').mkdir(parents=True, exist_ok=True)
          Path('reportes/generador/REPORTE.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Revalidar blindaje canónico de GOD
        run: |
          set -euo pipefail
          python IPTV-CHILE-GENERADOR/scripts/guard.py

      - name: Generar reporte de GOD
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('IPTV-CHILE-MAESTRA_GOD.m3u')
          text = p.read_text(encoding='utf-8-sig', errors='replace')
          urls = [x.strip() for x in text.splitlines() if x.strip().startswith(('http://','https://'))]
          extinf = sum(1 for x in text.splitlines() if x.startswith('#EXTINF:'))
          dup = len(urls) - len(set(urls))
          reconnect = text.count('#EXTVLCOPT:http-reconnect=true')
          sha = hashlib.sha256(p.read_bytes()).hexdigest()
          report = '# Reporte de estado - GOD\n\n'
          report += f'- Archivo: {p.as_posix()}\n'
          report += f'- Canales: **{extinf}**\n'
          report += f'- URLs: **{len(urls)}**\n'
          report += f'- Duplicados historicos: **{dup}** (permitidos por guard.py)\n'
          report += f'- Directivas de reconexion: **{reconnect}**\n'
          report += f'- SHA-256: {sha}\n\n'
          report += 'Reporte exclusivo de GOD; no modifica la lista.\n'
          Path('reportes/god').mkdir(parents=True, exist_ok=True)
          Path('reportes/god/REPORTE.md').write_text(report, encoding='utf-8')
          PY

      - name: Validar aislamiento final
        run: |
          set -euo pipefail
          sha256sum -c /tmp/generador-guard/maestras.sha256
          python IPTV-CHILE-GENERADOR/scripts/guard.py
          sha256sum -c /tmp/generador-guard/pluto.sha256
          sha256sum -c /tmp/generador-guard/scripts.sha256

          while IFS= read -r line; do
            file="${line:3}"
            case "$file" in
              IPTV-CHILE-GENERADOR/*|IPTV-CHILE-MAESTRA_GOD.m3u|reportes/generador/REPORTE.md|.github/workflows/generador.yml) ;;
              "") ;;
              *) echo "REGRESION: archivo fuera del ámbito del generador: $file"; exit 1 ;;
            esac
          done < <(git status --porcelain)

          echo "OK: ninguna lista o script externo fue modificado."

      - name: Publicar únicamente el generador
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-CHILE-GENERADOR IPTV-CHILE-MAESTRA_GOD.m3u reportes/generador/REPORTE.md

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en el generador."
            exit 0
          fi

          git commit -m "Actualizar IPTV-CHILE-GENERADOR"

          # Puede existir un push externo mientras se generaba la lista.
          # Si main avanzó, no mezclamos artefactos de dos ejecuciones:
          # abortamos el rebase y regeneramos sobre el main más reciente.
          for intento in 1 2 3; do
            git fetch origin main
            if git rev-parse HEAD = git rev-parse origin/main; then
              echo "main ya contiene exactamente este estado."
              exit 0
            fi

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "PUBLICACIÓN EXITOSA: main actualizado."
                exit 0
              fi
              echo "PUSH RECHAZADO: main cambió después del fetch; se regenerará sobre origin/main."
            fi

            echo "REBASE/PUSH NO PUBLICADO: la base cambió durante la publicación (intento $intento)."
            git rebase --abort || true

            if [ "$intento" -eq 3 ]; then
              echo "ERROR: main siguió cambiando durante tres intentos de publicación."
              exit 1
            fi

            # No mezclamos M3U/JSON generados de dos ejecuciones distintas.
            git reset --hard origin/main
            python IPTV-CHILE-GENERADOR/scripts/teleon_discovery.py
            python IPTV-CHILE-GENERADOR/scripts/teleon_validate.py
            python IPTV-CHILE-GENERADOR/scripts/collect.py
            python IPTV-CHILE-GENERADOR/scripts/fix_encoding.py
            python IPTV-CHILE-GENERADOR/scripts/check.py
            python IPTV-CHILE-GENERADOR/scripts/quality.py
            python IPTV-CHILE-GENERADOR/scripts/generate.py
            python IPTV-CHILE-GENERADOR/scripts/selftest.py

            sha256sum -c /tmp/generador-guard/maestras.sha256
            sha256sum -c /tmp/generador-guard/pluto.sha256
            sha256sum -c /tmp/generador-guard/scripts.sha256

            git add IPTV-CHILE-GENERADOR IPTV-CHILE-MAESTRA_GOD.m3u
            if git diff --cached --quiet; then
              echo "La regeneración sobre main no produjo cambios nuevos."
              exit 0
            fi
            git commit -m "Actualizar IPTV-CHILE-GENERADOR"
          done
