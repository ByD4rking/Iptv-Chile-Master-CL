name: IPTV Chile Generador - aislado

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "IPTV-CHILE-GENERADOR/**"
      - ".github/workflows/generador.yml"
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-chile-generador
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validar sintaxis
        run: |
          python -m py_compile             IPTV-CHILE-GENERADOR/scripts/collect.py             IPTV-CHILE-GENERADOR/scripts/check.py             IPTV-CHILE-GENERADOR/scripts/fix_encoding.py             IPTV-CHILE-GENERADOR/scripts/generate.py             IPTV-CHILE-GENERADOR/scripts/quality.py             IPTV-CHILE-GENERADOR/scripts/guard.py             IPTV-CHILE-GENERADOR/scripts/selftest.py

      - name: Guardar huellas protegidas
        run: |
          set -euo pipefail
          mkdir -p /tmp/generador-guard
          sha256sum IPTV-CHILE-MAESTRA_CORREGIDO.m3u IPTV-CHILE-MAESTRA_GOD.m3u > /tmp/generador-guard/maestras.sha256
          find pluto/output/playlists -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/generador-guard/pluto.sha256
          find scripts -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/generador-guard/scripts.sha256

      - name: Auditar aislamiento inicial
        run: python IPTV-CHILE-GENERADOR/scripts/guard.py

      - name: Recopilar fuentes independientes
        run: python IPTV-CHILE-GENERADOR/scripts/collect.py

      - name: Corregir codificación
        run: python IPTV-CHILE-GENERADOR/scripts/fix_encoding.py

      - name: Comprobar streams
        run: python IPTV-CHILE-GENERADOR/scripts/check.py

      - name: Analizar calidad
        run: python IPTV-CHILE-GENERADOR/scripts/quality.py

      - name: Generar M3U
        run: python IPTV-CHILE-GENERADOR/scripts/generate.py

      - name: Self-test del generador
        run: python IPTV-CHILE-GENERADOR/scripts/selftest.py

      - name: Validar aislamiento final
        run: |
          set -euo pipefail
          sha256sum -c /tmp/generador-guard/maestras.sha256
          sha256sum -c /tmp/generador-guard/pluto.sha256
          sha256sum -c /tmp/generador-guard/scripts.sha256

          while IFS= read -r line; do
            file="${line:3}"
            case "$file" in
              IPTV-CHILE-GENERADOR/*|.github/workflows/generador.yml) ;;
              "") ;;
              *) echo "REGRESION: archivo fuera del ámbito del generador: $file"; exit 1 ;;
            esac
          done < <(git status --porcelain)

          echo "OK: ninguna lista o script externo fue modificado."

      - name: Publicar únicamente el generador
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-CHILE-GENERADOR

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en el generador."
            exit 0
          fi

          git commit -m "Actualizar IPTV-CHILE-GENERADOR"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
