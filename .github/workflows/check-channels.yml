name: Verificar Canales

on:
  schedule:
    - cron: '0 6,18 * * *'   # 2 veces al día: 06:00 y 18:00 UTC
  workflow_dispatch:          # Ejecución manual desde Actions

permissions:
  contents: write

jobs:
  check-channels:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CLONAR REPOSITORIO
      # ============================================================
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # ============================================================
      # 2. CONFIGURAR PYTHON
      # ============================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================================
      # 3. INSTALAR DEPENDENCIAS
      # ============================================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # ============================================================
      # 4. GENERAR REPORTE
      # ============================================================
      - name: Generar reporte de canales
        working-directory: scripts
        run: |
          python generar_reporte.py \
            ../IPTV-CHILE-MAESTRA_CORREGIDO.m3u \
            ../IPTV-CHILE-MAESTRA_GOD.m3u \
            --salida ../REPORTE.md

      # ============================================================
      # 5. GUARDAR REPORTE EN GITHUB
      # ============================================================
      - name: Commitear reporte actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add REPORTE.md

          if git diff --staged --quiet; then
            echo "No hay cambios en REPORTE.md."
          else
            git commit -m "🔄 Actualiza reporte de canales [automático]"
            git push
          fi